[project]
name = "portfolio-bevel"
version = "0.1.0"
description = "Raytraced bevel tile renderer for samb.nyc"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.11",
    "pillow>=10.0",
    "matplotlib>=3.8",
    "ipywidgets>=8.1",
    "ipykernel>=6.29",
    "jupyterlab>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tools/bevel/bevelkit"]
