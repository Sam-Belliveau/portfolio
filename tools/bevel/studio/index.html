<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bevel Studio</title>
<style>
  :root { color-scheme: light dark; --bg:#f2f0ec; --fg:#23211d; --line:#cfccc4; --accent:#9c1c1c; --panel:#fbfaf8; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1a1a1c; --fg:#e6e3dd; --line:#3a3a3e; --accent:#e08585; --panel:#232326; } }
  * { box-sizing: border-box; }
  body { margin:0; font:13px/1.5 ui-sans-serif,-apple-system,Segoe UI,sans-serif; background:var(--bg); color:var(--fg);
         display:grid; grid-template-columns: 320px 1fr; height:100vh; overflow:hidden; }
  aside { overflow-y:auto; padding:14px; border-right:1px solid var(--line); background:var(--panel); }
  main { display:flex; flex-direction:column; min-width:0; }
  canvas { flex:1; width:100%; min-height:0; display:block; }
  #plots { display:flex; gap:10px; padding:8px; border-top:1px solid var(--line); background:var(--panel); }
  #plots figure { margin:0; flex:1; display:flex; flex-direction:column; gap:3px; min-width:0; }
  #plots figcaption { font-size:10px; text-transform:uppercase; letter-spacing:.07em; opacity:.65; }
  #plots canvas { height:190px; width:100%; border:1px solid var(--line); border-radius:4px; }
  #profilePlot { cursor:crosshair; touch-action:none; }
  h2 { font-size:11px; text-transform:uppercase; letter-spacing:.08em; margin:16px 0 6px; color:var(--accent); }
  h2:first-child { margin-top:0; }
  label { display:grid; grid-template-columns:112px 1fr 46px; align-items:center; gap:6px; margin:3px 0; }
  label span { font-size:11px; }
  input[type=range] { width:100%; }
  input[type=number] { width:46px; font-size:11px; padding:1px 3px; }
  select, input[type=color] { width:100%; font-size:12px; }
  textarea { width:100%; height:96px; font:11px/1.4 ui-monospace,Menlo,monospace; }
  button { font-size:12px; padding:5px 9px; margin:2px 2px 2px 0; cursor:pointer; border:1px solid var(--line);
           border-radius:4px; background:var(--panel); color:var(--fg); }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  #status { padding:6px 8px; font:11px/1.4 ui-monospace,Menlo,monospace; border-top:1px solid var(--line);
            white-space:pre-wrap; background:var(--panel); }
  .row { display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .warn { color:var(--accent); font-weight:600; }
</style>
</head>
<body>
<aside>
  <h2>Level</h2>
  <div class="row" id="levels"></div>

  <h2>Geometry</h2>
  <label><span>Corner style</span><select id="corner"><option value="g3">g3</option><option value="circular">circular</option></select><span></span></label>
  <label><span>Corner radius</span><input type="range" id="radius" min="0" max="60" step="0.5"><input type="number" id="radiusN" step="0.5"></label>
  <label><span>Height</span><input type="range" id="height" min="0.5" max="30" step="0.5"><input type="number" id="heightN" step="0.5"></label>
  <label><span>Skirt width</span><input type="range" id="skirt" min="0.5" max="36" step="0.5"><input type="number" id="skirtN" step="0.5"></label>
  <label><span>Tile margin</span><input type="range" id="margin" min="4" max="72" step="1"><input type="number" id="marginN" step="1"></label>

  <h2>Edge profile</h2>
  <label><span>Preset</span><select id="profileName"></select><span></span></label>
  <label><span>Continuity</span><select id="continuity"><option>G3</option><option>G2</option><option>G1</option></select><span></span></label>
  <label><span>Rim slope</span><input type="range" id="startSlope" min="-60" max="0" step="0.1"><input type="number" id="startSlopeN" step="0.05"></label>
  <label><span>Base slope</span><input type="range" id="endSlope" min="-60" max="0" step="0.1"><input type="number" id="endSlopeN" step="0.05"></label>
  <label style="grid-template-columns:1fr"><span>Points — drag on the plot below; double-click to add, alt-click to delete</span></label>
  <textarea id="points" spellcheck="false"></textarea>

  <h2>Material</h2>
  <label><span>Material</span><select id="material"></select><span></span></label>
  <label><span>Rests on</span><select id="ground"></select><span></span></label>
  <label><span>Albedo</span><input type="color" id="albedo"><span></span></label>
  <label><span>Specular</span><input type="range" id="specular" min="0" max="0.6" step="0.01"><input type="number" id="specularN" step="0.01"></label>
  <label><span>Gloss</span><input type="range" id="gloss" min="2" max="80" step="1"><input type="number" id="glossN" step="1"></label>

  <h2>Lighting</h2>
  <label><span>Sun azimuth</span><input type="range" id="sunAz" min="0" max="360" step="1"><input type="number" id="sunAzN" step="1"></label>
  <label><span>Sun elevation</span><input type="range" id="sunEl" min="5" max="89" step="1"><input type="number" id="sunElN" step="1"></label>
  <label><span>Falloff</span><select id="falloff"><option value="gaussian">gaussian</option><option value="disk">disk</option></select><span></span></label>
  <label><span>Gaussian σ°</span><input type="range" id="sunSigma" min="0.1" max="40" step="0.1"><input type="number" id="sunSigmaN" step="0.1"></label>
  <label><span>Disk radius°</span><input type="range" id="sunRadius" min="0.1" max="30" step="0.1"><input type="number" id="sunRadiusN" step="0.1"></label>
  <label><span>Sun colour</span><input type="color" id="sunColour"><span></span></label>
  <label><span>Sky horizon</span><input type="color" id="skyHorizonColour"><span></span></label>
  <label><span>Sky zenith</span><input type="color" id="skyZenithColour"><span></span></label>
  <label><span>Sky strength</span><input type="range" id="skyStrength" min="0" max="0.8" step="0.01"><input type="number" id="skyStrengthN" step="0.01"></label>

  <h2>Preview</h2>
  <label><span>Card width</span><input type="range" id="cardW" min="60" max="900" step="10"><input type="number" id="cardWN" step="10"></label>
  <label><span>Card height</span><input type="range" id="cardH" min="60" max="700" step="10"><input type="number" id="cardHN" step="10"></label>
  <label><span>Azimuths</span><input type="range" id="azimuths" min="8" max="128" step="4"><input type="number" id="azimuthsN" step="4"></label>
  <div class="row"><button id="tileView">Show 9-slice tile size</button></div>

  <h2>Config</h2>
  <div class="row">
    <button class="primary" id="save">Save config.json</button>
    <button id="reload">Reload saved</button>
    <button id="defaults">Restore defaults</button>
  </div>
  <div class="row"><button id="bake">Bake tiles with Python</button></div>
</aside>
<main>
  <canvas id="view"></canvas>
  <div id="plots">
    <figure><figcaption>edge profile — draggable</figcaption><canvas id="profilePlot"></canvas></figure>
    <figure><figcaption>signed curvature — over arc length</figcaption><canvas id="curvaturePlot"></canvas></figure>
  </div>
  <div id="status">starting…</div>
</main>
<script type="module" src="./app.js"></script>
</body>
</html>
